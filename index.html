<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="La Réponse construit des solutions numériques sobres et sur mesure pour les systèmes, les habitudes et les personnes déjà en place.">
  <meta name="author" content="La Réponse">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#f9f9f9">
  <meta name="color-scheme" content="light">
  <meta name="format-detection" content="telephone=no">

  <title>La Réponse | Solutions numériques sur mesure</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --paper: #f9f9f9;
      --ink: #000000;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background: var(--paper);
      display: grid;
      place-items: center;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    .frame {
      width: min(100vw, 150vh);
      height: min(100vh, 66.6666667vw);
      background: var(--paper);
      overflow: hidden;
    }

    .poster {
      display: block;
      width: 100%;
      height: 100%;
      background: var(--paper);
    }

    .paper {
      fill: var(--paper);
    }

    .rail,
    .ink {
      fill: var(--ink);
    }

    .brand,
    .hero,
    .because {
      font-family: "Anton", Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
      font-weight: 400;
      fill: var(--ink);
    }

    .brand {
      font-size: 46px;
      letter-spacing: 0.5px;
    }

    .hero {
      font-size: 575px;
      letter-spacing: -6px;
    }

    .because {
      font-size: 225px;
      letter-spacing: -3px;
    }

    .nav,
    .counter,
    .micro,
    .side-copy,
    .footer-plus-text {
      font-family: "Inter", Arial, Helvetica, sans-serif;
      font-weight: 800;
      fill: var(--ink);
    }

    .nav {
      font-size: 15px;
      letter-spacing: 0.55px;
    }

    .counter {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 0.4px;
    }

    .micro {
      font-size: 13.5px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .footer-plus-text {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.3px;
    }

    .side-copy {
      fill: var(--white);
      font-size: 12.5px;
      font-weight: 900;
      letter-spacing: 0.65px;
    }

    .side-dot {
      fill: var(--white);
    }

    .strike {
      fill: var(--ink);
    }

    .arrow {
      fill: none;
      stroke: var(--ink);
      stroke-width: 2.4;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }
  </style>
</head>

<body id="accueil">
  <main class="frame">
    <svg class="poster" viewBox="0 0 1536 1024" aria-label="La Réponse landing page reproduction" role="img">
      <rect class="paper" x="0" y="0" width="1536" height="1024" />
      <rect class="rail" x="0" y="0" width="80" height="1024" />

      <text class="brand" x="117" y="79" textLength="197" lengthAdjust="spacingAndGlyphs">LA RÉPONSE</text>

      <text class="nav" x="951" y="68" textLength="80" lengthAdjust="spacingAndGlyphs">À PROPOS</text>
      <text class="nav" x="1072" y="68" textLength="68" lengthAdjust="spacingAndGlyphs">PROJETS</text>
      <text class="nav" x="1178" y="68" textLength="84" lengthAdjust="spacingAndGlyphs">APPROCHE</text>
      <text class="nav" x="1300" y="68" textLength="60" lengthAdjust="spacingAndGlyphs">SERVICE</text>
      <text class="nav" x="1398" y="68" textLength="75" lengthAdjust="spacingAndGlyphs">CONTACT</text>
      <circle class="ink" cx="1476" cy="62" r="10" />

      <g class="side-copy" transform="translate(59 840) rotate(-90)">
        <text x="0" y="0" textLength="215" lengthAdjust="spacingAndGlyphs">DES RÉPONSES TOUTES FAITES.</text>
        <text x="0" y="-21" textLength="150" lengthAdjust="spacingAndGlyphs">NOUS N'AVONS PAS</text>
      </g>
      <circle class="side-dot" cx="42" cy="862" r="7.5" />

      <text id="titre-hero" class="hero" x="150" y="650" textLength="1336" lengthAdjust="spacingAndGlyphs">Pourquoi?</text>

      <text class="because" x="148" y="858" textLength="605" lengthAdjust="spacingAndGlyphs">Parce que.</text>

      <path class="strike" d="
        M118 797
        C136 789 162 792 190 786
        C312 787 503 780 696 773
        C752 771 794 769 817 775
        C821 778 810 781 793 783
        C807 784 822 787 819 791
        C758 798 565 804 344 809
        C240 812 163 815 121 812
        C114 807 124 801 118 797Z" />

      <text class="counter" x="117" y="970" textLength="55" lengthAdjust="spacingAndGlyphs">( 01 )</text>

      <path class="arrow" d="M804 944 V973 M793 963 L804 974 L815 963" />

      <text class="micro" x="1122" y="955" textLength="312" lengthAdjust="spacingAndGlyphs">Pas de recette. Pas de plateforme imposée.</text>
      <text class="micro" x="1122" y="974" textLength="366" lengthAdjust="spacingAndGlyphs">La réponse construite à partir de votre requête.</text>

      <text class="footer-plus-text" x="1450" y="968" textLength="38" lengthAdjust="spacingAndGlyphs">i-[æ]-0</text>
    </svg>
  </main>
</body>
</html>
