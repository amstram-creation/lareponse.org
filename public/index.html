<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La Réponse</title>

  <style>
    :root {
      color-scheme: light;

      --paper: #fff;
      --ink: #000;

      --font-display: Impact, Haettenschweiler, "Arial Narrow", "Aptos Narrow",
        "Roboto Condensed", "Helvetica Neue Condensed", "Arial Black", sans-serif;
      --font-sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;

      --rail-size: clamp(3.25rem, 5vw, 5rem);
      --edge: clamp(1rem, 4vw, 4.75rem);
      --gap: clamp(1rem, 3vw, 3.5rem);
      --focus-size: 0.16rem;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-block-size: 100%;
      background: var(--paper);
      color: var(--ink);
    }

    body {
      margin: 0;
      min-block-size: 100svh;
      overflow-x: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-sans);
      text-rendering: geometricPrecision;
    }

    a {
      color: inherit;
    }

    :focus {
      outline: none;
    }

    :focus-visible {
      outline: var(--focus-size) solid currentColor;
      outline-offset: 0.28rem;
    }

    .skip-link {
      position: fixed;
      z-index: 20;
      inset-block-start: 1rem;
      inset-inline-start: 1rem;
      padding: 0.7rem 0.9rem;
      background: var(--ink);
      color: var(--paper);
      font-weight: 800;
      text-decoration: none;
      transform: translateY(calc(-100% - 2rem));
      transition: transform 160ms linear;
    }

    .skip-link:focus-visible {
      transform: translateY(0);
    }

    .page {
      display: grid;
      grid-template-columns: var(--rail-size) minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr) auto;
      grid-template-areas:
        "rail header"
        "rail main"
        "rail footer";
      min-block-size: 100svh;
      background: var(--paper);
    }

    .site-header {
      grid-area: header;
      display: grid;
      grid-template-columns: max-content minmax(0, 1fr) max-content;
      align-items: start;
      column-gap: var(--gap);
      padding-block-start: max(1rem, min(3.2vh, 2.5rem));
      padding-inline: var(--edge);
    }

    .brand {
      font-family: var(--font-display);
      font-size: clamp(1.85rem, 3.25vw, 3.8rem);
      font-weight: 900;
      line-height: 0.85;
      letter-spacing: 0;
      text-transform: uppercase;
      text-decoration: none;
      white-space: nowrap;
    }

    .site-nav {
      justify-self: end;
    }

    .site-nav ul {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 0.35rem clamp(0.8rem, 3vw, 3.2rem);
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .site-nav a {
      display: inline-block;
      padding-block: 0.35rem;
      padding-inline: 0.05rem;
      font-size: clamp(0.78rem, 1vw, 1rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0.055em;
      text-transform: uppercase;
      text-decoration: none;
    }

    .site-nav a:hover {
      text-decoration: line-through;
      text-decoration-thickness: 0.14em;
      text-underline-offset: 0.18em;
    }

    .header-dot {
      inline-size: clamp(0.9rem, 1.35vw, 1.25rem);
      block-size: clamp(0.9rem, 1.35vw, 1.25rem);
      margin-block-start: 0.4rem;
      border-radius: 50%;
      background: var(--ink);
    }

    .rail {
      grid-area: rail;
      display: grid;
      place-items: end center;
      padding-block: max(1rem, 3vh);
      padding-inline: 0.25rem;
      background: var(--ink);
      color: var(--paper);
    }

    .rail__stack {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
    }

    .rail__dot {
      flex: 0 0 auto;
      inline-size: 0.72rem;
      block-size: 0.72rem;
      border-radius: 50%;
      background: currentColor;
    }

    .rail p {
      margin: 0;
      max-block-size: 34ch;
      font-size: clamp(0.66rem, 0.78vw, 0.9rem);
      font-weight: 900;
      line-height: 1.08;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .main-content {
      grid-area: main;
      display: grid;
      min-block-size: max(22rem, 60vh);
    }

    .hero {
      align-self: center;
      inline-size: min(100%, 116rem);
      margin-inline: auto;
      margin-block-start: clamp(-4rem, -5vh, -1rem);
      padding-inline: var(--edge);
    }

    .hero h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(5.2rem, min(23vw, 38vh), 25rem);
      font-weight: 900;
      line-height: 0.78;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .answer {
      margin: clamp(0.35rem, 1.2vw, 1.25rem) 0 0;
      font-family: var(--font-display);
      font-size: clamp(3rem, min(8.8vw, 15vh), 10rem);
      font-weight: 900;
      line-height: 0.72;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .answer__struck {
      position: relative;
      display: inline-block;
      padding-inline-end: 0.05em;
    }

    .answer__struck::before,
    .answer__struck::after {
      content: "";
      position: absolute;
      z-index: 2;
      inset-inline: -0.06em -0.18em;
      inset-block-start: 54%;
      block-size: clamp(0.28rem, 0.9vw, 0.95rem);
      background: currentColor;
      pointer-events: none;
    }

    .answer__struck::before {
      transform: translateY(-45%) rotate(0.45deg);
      clip-path: polygon(
        0 38%,
        6% 20%,
        14% 32%,
        24% 18%,
        35% 34%,
        48% 16%,
        62% 30%,
        76% 18%,
        88% 34%,
        100% 24%,
        100% 74%,
        92% 66%,
        78% 82%,
        64% 70%,
        49% 86%,
        35% 72%,
        20% 84%,
        8% 70%,
        0 80%
      );
    }

    .answer__struck::after {
      inset-block-start: 57%;
      block-size: clamp(0.22rem, 0.65vw, 0.68rem);
      transform: translateY(-48%) rotate(-0.85deg);
      clip-path: polygon(
        0 28%,
        12% 14%,
        23% 24%,
        38% 12%,
        52% 26%,
        69% 10%,
        84% 25%,
        100% 16%,
        100% 66%,
        86% 82%,
        70% 68%,
        54% 88%,
        38% 70%,
        21% 84%,
        0 72%
      );
    }

    .answer__dot {
      position: relative;
      z-index: 3;
    }

    .page-footer {
      grid-area: footer;
      display: grid;
      grid-template-columns: minmax(6ch, 1fr) auto minmax(18ch, 1fr);
      align-items: end;
      gap: var(--gap);
      padding-inline: var(--edge);
      padding-block-end: max(1rem, min(3.2vh, 2.2rem));
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .page-footer p {
      margin: 0;
    }

    .footer-index {
      font-size: clamp(1rem, 1.4vw, 1.45rem);
      letter-spacing: 0.08em;
    }

    .footer-cue {
      justify-self: center;
      font-size: clamp(2rem, 2.5vw, 3rem);
      font-weight: 700;
      line-height: 0.7;
    }

    .footer-right {
      justify-self: end;
      display: grid;
      grid-template-columns: minmax(22ch, max-content) max-content;
      align-items: end;
      gap: clamp(1rem, 3vw, 3.75rem);
    }

    .footer-right p {
      max-inline-size: 32ch;
      font-size: clamp(0.75rem, 0.95vw, 0.98rem);
      line-height: 1.16;
    }

    .footer-plus {
      font-size: clamp(1.8rem, 2.5vw, 3rem);
      font-weight: 700;
      line-height: 0.8;
      letter-spacing: 0;
    }

    @supports (font-stretch: condensed) {
      .brand,
      .hero h1,
      .answer {
        font-stretch: condensed;
      }
    }

    @media (max-width: 56rem) {
      :root {
        --edge: clamp(1rem, 5vw, 2rem);
        --gap: clamp(0.75rem, 4vw, 1.5rem);
      }

      .page {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto minmax(0, 1fr) auto;
        grid-template-areas:
          "rail"
          "header"
          "main"
          "footer";
      }

      .site-header {
        grid-template-columns: 1fr max-content;
        grid-template-areas:
          "brand dot"
          "nav nav";
        row-gap: clamp(1rem, 4vw, 1.5rem);
        padding-block-start: clamp(1rem, 4vh, 1.8rem);
      }

      .brand {
        grid-area: brand;
        font-size: clamp(2rem, 9vw, 3.4rem);
      }

      .site-nav {
        grid-area: nav;
        justify-self: stretch;
      }

      .site-nav ul {
        justify-content: flex-start;
        gap: 0.4rem clamp(0.9rem, 5vw, 1.6rem);
      }

      .site-nav a {
        font-size: clamp(0.75rem, 3.2vw, 0.95rem);
        padding-block: 0.4rem;
      }

      .header-dot {
        grid-area: dot;
        margin-block-start: 0.35rem;
      }

      .rail {
        display: block;
        padding: 0;
      }

      .rail__stack {
        justify-content: flex-start;
        gap: 0.65rem;
        padding-block: 0.55rem;
        padding-inline: var(--edge);
        writing-mode: horizontal-tb;
        transform: none;
      }

      .rail__dot {
        inline-size: 0.52rem;
        block-size: 0.52rem;
      }

      .rail p {
        max-block-size: none;
        font-size: 0.65rem;
        line-height: 1.05;
      }

      .main-content {
        min-block-size: max(22rem, 56vh);
      }

      .hero {
        margin-block-start: 0;
      }

      .hero h1 {
        font-size: clamp(3.7rem, 20vw, 9rem);
        line-height: 0.82;
        letter-spacing: 0;
      }

      .answer {
        margin-block-start: clamp(0.25rem, 2vw, 0.75rem);
        font-size: clamp(2.45rem, 13.5vw, 5.75rem);
        letter-spacing: 0;
      }

      .answer__struck::before,
      .answer__struck::after {
        block-size: clamp(0.22rem, 1.6vw, 0.62rem);
      }

      .page-footer {
        grid-template-columns: 1fr max-content;
        grid-template-areas:
          "index cue"
          "right right";
        gap: clamp(1.5rem, 7vw, 3rem) var(--gap);
        padding-block-end: clamp(1rem, 5vh, 2rem);
      }

      .footer-index {
        grid-area: index;
      }

      .footer-cue {
        grid-area: cue;
        justify-self: end;
      }

      .footer-right {
        grid-area: right;
        justify-self: stretch;
        grid-template-columns: minmax(0, 1fr) max-content;
        gap: 1rem;
      }

      .footer-right p {
        max-inline-size: 34ch;
        font-size: clamp(0.72rem, 3vw, 0.9rem);
      }

      .footer-plus {
        justify-self: end;
        font-size: clamp(1.8rem, 8vw, 2.6rem);
      }
    }

    @media (max-width: 24rem) {
      .hero h1 {
        font-size: clamp(3.1rem, 18vw, 4.5rem);
        letter-spacing: 0;
      }

      .answer {
        font-size: clamp(2.1rem, 12vw, 3.2rem);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>

<body id="accueil">
  <a class="skip-link" href="#contenu">Aller au contenu principal</a>

  <div class="page">
    <header class="site-header">
      <a class="brand" href="/" aria-label="La Réponse — accueil">LA RÉPONSE</a>

      <nav class="site-nav" aria-label="Navigation principale">
        <ul>
          <li><a href="/a-propos/">À PROPOS</a></li>
          <li><a href="/projets/">PROJETS</a></li>
          <li><a href="/approche/">APPROCHE</a></li>
          <li><a href="/services/">SERVICES</a></li>
          <li><a href="/contact/">CONTACT</a></li>
        </ul>
      </nav>

      <span class="header-dot" aria-hidden="true"></span>
    </header>

    <aside class="rail" aria-label="Manifeste latéral">
      <div class="rail__stack">
        <span class="rail__dot" aria-hidden="true"></span>
        <p>
          NOUS NE DONNONS PAS<br>
          DES RÉPONSES TOUTES FAITES.
        </p>
      </div>
    </aside>

    <main id="contenu" class="main-content" tabindex="-1">
      <section class="hero" aria-labelledby="titre-hero">
        <h1 id="titre-hero">Pourquoi?</h1>

        <p class="answer">
          <span class="answer__struck">Parce que</span><span class="answer__dot">.</span>
        </p>
      </section>
    </main>

    <footer class="page-footer">
      <p class="footer-index">( 01 )</p>

      <div class="footer-cue" aria-hidden="true">↓</div>

      <div class="footer-right">
        <p>
          Pas de recette. Pas de plateforme imposée. <br>La réponse construite à partir de votre requête.
        </p>

        <span class="footer-plus" aria-hidden="true">[+]</span>
      </div>
    </footer>
  </div>
</body>
</html>
